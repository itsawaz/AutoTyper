name: Build desktop apps

# Builds the standalone AutoTyper client for macOS (.app) and Windows (.exe)
# and uploads them as downloadable artifacts.
#
# Triggers:
#   - on push to any branch (so you can test builds from your working branch)
#   - manually via the "Run workflow" button (workflow_dispatch)

on:
  push:
    branches: ["**"]
    paths:
      - "client/**"
      - ".github/workflows/build-desktop.yml"
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend base URL to bake into the build (AUTOTYPER_API_BASE)"
        required: false
        default: ""

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: AutoTyper-macos
          - os: windows-latest
            artifact: AutoTyper-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: client
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # Optional: bake a backend URL into the build so the packaged app points
      # at your deployed API. Falls back to the client default if not provided.
      - name: Configure backend URL (optional)
        if: ${{ github.event.inputs.api_base != '' }}
        shell: bash
        run: echo "AUTOTYPER_API_BASE=${{ github.event.inputs.api_base }}" >> "$GITHUB_ENV"

      - name: Build with PyInstaller
        working-directory: client
        run: pyinstaller autotyper.spec --noconfirm

      - name: List build output
        working-directory: client
        shell: bash
        run: ls -laR dist || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            client/dist/**
          if-no-files-found: error
          retention-days: 14
